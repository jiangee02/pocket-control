  if(fsParent){
    const up=document.createElement('div'); up.className='fsrow dir';
    const n=document.createElement('span'); n.className='fsname'; n.textContent='.. 返回上级';
    up.appendChild(n); up.onclick=()=>fsReq(fsParent); box.appendChild(up);
  }
  const es=m.entries||[];
  es.forEach(e=>{
    const full=fsJoin(fsCur,e.name);
    const row=document.createElement('div'); row.className='fsrow'+(e.dir?' dir':'');
    if(fsMulti && !e.dir){
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=fsSel.has(full);
      cb.style.marginRight='6px'; cb.onclick=ev=>ev.stopPropagation();
      cb.onchange=()=>{ if(cb.checked) fsSel.add(full); else fsSel.delete(full); updateFsSel(); };
      row.appendChild(cb);
    }
    const nm=document.createElement('span'); nm.className='fsname'; nm.textContent=e.name;
    const meta=document.createElement('span'); meta.className='fsmeta'; meta.textContent=e.dir?'目录':fmtSize(e.size||0);
    row.appendChild(nm); row.appendChild(meta);
    if(e.dir) row.onclick=()=>fsReq(full);
    else if(fsMulti) row.onclick=()=>{ if(fsSel.has(full)) fsSel.delete(full); else fsSel.add(full); renderFs(m); updateFsSel(); };
    else row.onclick=()=>{ if(authed) fsDownload(full, e.name, e.size||0); };
    box.appendChild(row);
  });
  if(!es.length){ const em=document.createElement('div'); em.className='hint'; em.style.padding='10px'; em.textContent='（空目录）'; box.appendChild(em); }
}
function updateFsSel(){
  $('fsSelBar').style.display = fsMulti ? 'flex' : 'none';
  $('fsSelCount').textContent = fsSel.size ? ('已选 '+fsSel.size+' 个文件') : '';
  $('fsDlSel').disabled = !fsSel.size;
  $('fsDlSel').textContent = fsSel.size ? ('下载所选('+fsSel.size+')') : '下载所选';
}
/* 下载分发：先弹确认框防误点；直连走专用 HTTP（带进度/速度，不挤视频流），中继回退旧 fs-get 流通道。
   同一文件正在下载/已暂停时再点不会重复加任务（避免连点几下堆出一堆重复任务） */
function fsDownload(path, name, size, skipConfirm){
  if(canHttp()){
    for(const t of tasks.values()) if(t.kind==='down' && t.path===path && (t.state==='active'||t.state==='paused')){
      toast('该文件已在任务列表中：'+name); openTaskPanel(); return;
    }
  }
  if(!skipConfirm && !confirm('下载「'+name+'」'+(size>0?'（'+fmtSize(size)+'）':'')+' 到本机？')) return;
  if(canHttp()) httpDownload(path, name, size);
  else { send({t:'fs-get', path}); toast('正在下载：'+name); }
}
$('fsUp').onclick=()=>{ if(fsParent) fsReq(fsParent); };
$('fsRefresh').onclick=()=>fsReq(fsCur||'');
$('fsMultiBtn').onclick=()=>{ fsMulti=!fsMulti; if(!fsMulti) fsSel.clear(); $('fsMultiBtn').textContent=fsMulti?'退出多选':'多选'; fsReq(fsCur||''); updateFsSel(); };
$('fsSelClear').onclick=()=>{ fsSel.clear(); fsReq(fsCur||''); updateFsSel(); };
$('fsDlSel').onclick=()=>{
  if(!fsSel.size) return;
  if(!confirm('下载所选 '+fsSel.size+' 个文件到本机？')) return;
  const items=[...fsSel]; fsSel.clear(); updateFsSel();
  items.forEach(p=>{ const name=p.slice(p.lastIndexOf('/')+1); fsDownload(p, name, 0, true); });
  toast('开始下载 '+items.length+' 个文件');
};
$('fsSelAll').onclick=()=>{
  if(!fsLast) return;
  const files=(fsLast.entries||[]).filter(e=>!e.dir).map(e=>fsJoin(fsLast.path||'',e.name));
  const allIn=files.length>0 && files.every(p=>fsSel.has(p));
  if(allIn) files.forEach(p=>fsSel.delete(p)); else files.forEach(p=>fsSel.add(p));
  renderFs(fsLast); updateFsSel();
};

/* ================= 传输任务：文件面板「任务」入口，统一进度/暂停/继续/取消 ================= */
/* 宽屏桌面下面板是停靠栏：打开时标记 body.panel，让画面区域跟着收缩（窄屏/独立窗口仍是覆盖式） */
function syncPanelLayout(){
  document.body.classList.toggle('panel',
    $('filePanel').classList.contains('open') || $('taskPanel').classList.contains('open'));
  // 中继模式文件走 WS（始终加密），这个开关只对直连 HTTP 通道有效，直接隐藏免误解
  const er = $('encRow'); if(er) er.style.display = canHttp() ? '' : 'none';
}
function openTaskPanel(){ $('taskPanel').classList.add('open'); syncPanelLayout(); }
function updateTaskUi(){
  let n=0; for(const t of tasks.values()) if(t.state==='queued'||t.state==='active'||t.state==='paused') n++;
  const b=$('taskBadge'); b.style.display=n?'inline-block':'none'; b.textContent=n;
  $('taskEmpty').style.display=$('fileList').children.length?'none':'';
}
function setTaskState(id,state){ const t=tasks.get(id); if(t){ t.state=state; updateTaskUi(); } }
function setBar(id, done, total){
  const el = document.querySelector('#bar'+id+' .bar > i');
  if(el && total>0) el.style.width = Math.min(100, done/total*100).toFixed(1)+'%';
}
function addCard(id, title){
  const d=document.createElement('div'); d.className='fcard'; d.id='bar'+id;
  const b=document.createElement('b'); b.textContent=title; d.appendChild(b);
  const bar=document.createElement('div'); bar.className='bar'; bar.appendChild(document.createElement('i')); d.appendChild(bar);
  const row=document.createElement('div'); row.style.marginTop='6px';
  const st=document.createElement('span'); st.className='hint'; st.id='st'+id; st.textContent='等待中…';
  const sp=document.createElement('span'); sp.className='hint'; sp.id='sp'+id; sp.style.marginLeft='8px';
  row.appendChild(st); row.appendChild(sp); d.appendChild(row);
  const btns=document.createElement('div'); btns.className='tbtns'; d.appendChild(btns);
  $('fileList').prepend(d); updateTaskUi(); return d;
}
function finishCard(id){ const btns=document.querySelector('#bar'+id+' .tbtns'); if(btns) btns.querySelectorAll('.tpause,.tcancel').forEach(x=>x.remove()); }
function addCardBtn(id,label,onclick){ const btns=document.querySelector('#bar'+id+' .tbtns'); if(!btns) return; const b=document.createElement('button'); b.textContent=label; b.onclick=onclick; btns.appendChild(b); }
function abortUploadXhrs(t){
  if(t.xhrs) t.xhrs.forEach(x=>{ try{ x.abort(); }catch(_){} });
  else if(t.xhr) { try{ t.xhr.abort(); }catch(_){} }
}
function wireTaskCtrls(id,t){  const btns=document.querySelector('#bar'+id+' .tbtns'); if(!btns) return;
  if(t.pause){
    const p=document.createElement('button'); p.className='tpause'; p.textContent='暂停';
    p.onclick=()=>{ if(t.state==='paused'){ if(t.resume) t.resume(); p.textContent='暂停'; }
      else if(t.state==='active'||t.state==='queued'){ t.pause(); p.textContent='继续'; } };
    btns.appendChild(p);
  }
  const c=document.createElement('button'); c.className='tcancel'; c.textContent='取消';
  c.onclick=()=>{ if(t.state==='done'||t.state==='failed'||t.state==='cancelled') return; if(t.cancel) t.cancel(); };
  btns.appendChild(c);
}
$('btnTasks').onclick=()=>{ $('taskPanel').classList.toggle('open'); syncPanelLayout(); };
$('btnCloseTasks').onclick=()=>{ $('taskPanel').classList.remove('open'); syncPanelLayout(); };
$('btnClearTasks').onclick=()=>{
  for(const [id,t] of [...tasks]) if(t.state==='done'||t.state==='failed'||t.state==='cancelled'){
    const el=$('bar'+id); if(el) el.remove(); tasks.delete(id);
  }
  updateTaskUi();
};

/* 文件传输加密开关：只影响直连 HTTP 通道（/upload、/file）的文件内容；
   画面/触控/剪贴板始终加密。默认开启，选择记在本机浏览器。 */
let xferEncOn = true;
try{ xferEncOn = localStorage.getItem('xferEnc') !== '0'; }catch(_){}
function syncEncUi(){
  xferEncOn = $('xferEnc').checked;
  $('encNote').textContent = xferEncOn ? '安全传输' : '快速传输';
  $('encNote').classList.toggle('off', !xferEncOn);
  try{ localStorage.setItem('xferEnc', xferEncOn?'1':'0'); }catch(_){}
}
$('xferEnc').checked = xferEncOn;
syncEncUi();
$('xferEnc').onchange = ()=>{
  syncEncUi();
  toast(xferEncOn ? '文件传输加密已开启' : '文件传输加密已关闭（文件内容不加密）');
};

async function upload(file, rel){
  const id='u'+(++taskSeq);
  const item={file, rel:rel||'', id, enc: xferEncOn};   // 排队时定下模式，之后切换开关不影响已在队列里的文件
  addCard(id, '↑ '+(rel?rel+'/':'')+file.name);
  const online = authed && ws && ws.readyState === 1;
  const st=$('st'+id);
  st.textContent = online ? '排队中，将自动发送' : '等待连接，连上后自动发送';
  const t={kind:'up', state:'queued'}; tasks.set(id,t);
  t.pause=()=>{
    if(t.state==='queued'){ const i=upQueue.indexOf(item); if(i>=0) upQueue.splice(i,1); setTaskState(id,'paused'); st.textContent='已暂停，点「继续」重新发送'; }
    else if(t.state==='active'){ t.wantPause=true; abortUploadXhrs(t); }
  };
  t.resume=()=>{ if(t.state!=='paused') return; t.wantPause=false; upQueue.unshift(item); setTaskState(id,'queued'); st.textContent='排队中，将自动发送'; pumpUploads(); };
  t.cancel=()=>{ t.cancelled=true; const i=upQueue.indexOf(item); if(i>=0) upQueue.splice(i,1); abortUploadXhrs(t); setTaskState(id,'cancelled'); st.textContent='已取消'; finishCard(id); };
  if(canHttp()) wireTaskCtrls(id,t);
  else {  // 中继旧通道不支持暂停，只给取消
    const c=document.createElement('button'); c.className='tcancel'; c.textContent='取消';
    c.onclick=()=>{ if(t.state!=='cancelled'&&t.state!=='done'&&t.state!=='failed') t.cancel(); };
    document.querySelector('#bar'+id+' .tbtns').appendChild(c);
  }
  upQueue.push(item);
  openTaskPanel();
  toast(online ? '已加入发送任务：'+file.name : '已加入发送任务，连接后自动发送：'+file.name);
  pumpUploads();
}
function pumpUploads(){
  if(upBusy || !upQueue.length) return;
  if(!authed || !ws || ws.readyState !== 1) return;   // 断线时先排队，重连 ready 后自动继续
  upBusy = true;
  const item = upQueue.shift();
  const task = canHttp() ? uploadHttp(item) : uploadOne(item);
  task.finally(()=>{ upBusy = false; setTimeout(pumpUploads, 250); });
}
/* 专用 HTTP 上传：文件切块加密拼成 Blob，XHR 单独连接发送（原生上传进度），
   不再与触控指令挤同一条 WS 队列；被控端流式解密直写接收目录。
   暂停=中断本次发送（被控端自动清理半截文件），继续=重新排队从头发送（Blob 已缓存，不用重新加密）。 */
async function uploadHttp(item){
  if(item.file.size >= 2*1024*1024) return uploadHttpParts(item);
  return uploadHttpSingle(item);
}
/* 明文帧：4 字节大端长度 + 文件切片。Blob 组合只引用原文件，不读取、不复制数据。 */
function pushPlainFrame(parts, file, off, end){
  const n = end - off;
  const h = new Uint8Array(4);
  h[0]=(n>>>24)&0xff; h[1]=(n>>>16)&0xff; h[2]=(n>>>8)&0xff; h[3]=n&0xff;
  parts.push(h, file.slice(off, end));
}
/* 明文分块：按体积自适应，1MB~4MB。3 段并行的目标下保持每段 3~4 帧，
   帧太碎徒增开销，帧太大又会让被控端单次分配内存过多（上限 8MB）。 */
function plainChunkSize(size){
  return Math.min(4*1024*1024, Math.max(1024*1024, Math.ceil(size/12)));
}
/* 小文件：一次 POST 发完。 */
async function uploadHttpSingle(item){
  const {file, rel, id} = item;
  const t = tasks.get(id);
  const st = $('st'+id), sp = $('sp'+id);
  setTaskState(id,'active');
  const encMode = item.enc !== false;
  // 明文直接交文件切片给浏览器边读边发；加密才需要先读块加密
  const CH = encMode ? 256*1024 : plainChunkSize(file.size);
  if(!item.blob){
    if(st) st.textContent = encMode ? '准备加密…' : '准备发送…';
    const parts = [];
    if(!encMode){
      for(let off=0; off<file.size; off+=CH) pushPlainFrame(parts, file, off, Math.min(off+CH, file.size));
    } else {
      try{
        for(let off=0; off<file.size; off+=CH){
          if(t && t.cancelled) return;
          const buf = new Uint8Array(await file.slice(off, off+CH).arrayBuffer());
          const body = await encBytes(buf);
          const frame = new Uint8Array(4 + body.length);
          frame[0]=(body.length>>>24)&0xff; frame[1]=(body.length>>>16)&0xff; frame[2]=(body.length>>>8)&0xff; frame[3]=body.length&0xff;
          frame.set(body, 4); parts.push(frame);
          if((off/CH)%16===0){ if(st) st.textContent='准备中 '+Math.min(99,Math.round(off/Math.max(1,file.size)*100))+'%'; await new Promise(r=>setTimeout(r,0)); }
        }
      }catch(e){ if(st){ st.textContent='读取文件失败：'+e.message; st.style.color='#C9404F'; } setTaskState(id,'failed'); finishCard(id); return; }
    }
    item.blob = new Blob(parts, {type:'application/octet-stream'});
  }
  if(t && t.cancelled) return;
  if(t && t.wantPause){ setTaskState(id,'paused'); if(st) st.textContent='已暂停，点「继续」重新发送'; return; }
  const q = new URLSearchParams({pin:curPin, name:file.name, dest:$('upDest').value, rel:rel});
  if(!encMode) q.set('enc','0');
  if(st) st.textContent='正在发送…';
  await new Promise(resolve=>{
    const xhr = new XMLHttpRequest(); if(t) t.xhr = xhr;
    xhr.open('POST', '/upload?'+q.toString());
    xhr.responseType = 'arraybuffer';
    let lastT=performance.now(), lastLoaded=0, speed=0;
    xhr.upload.onprogress = e=>{
      const total = e.total || item.blob.size, now = performance.now();
      if(now-lastT>=400){ speed=(e.loaded-lastLoaded)/((now-lastT)/1000); lastT=now; lastLoaded=e.loaded; }
      setBar(id, e.loaded, total);
      if(st) st.textContent='正在发送 '+Math.min(100,Math.round(e.loaded/Math.max(1,total)*100))+'%';
      if(sp) sp.textContent=fmtSpeed(speed)+' · 剩余 '+fmtEta((total-e.loaded)/Math.max(1,speed));
    };
    xhr.onload = async ()=>{
      if(t) t.xhr = null;
      try{
        const raw = new Uint8Array(xhr.response);
        const plain = encMode ? await decBytes(raw) : raw;
        const j = JSON.parse(new TextDecoder().decode(plain));
        setBar(id,1,1);
        if(j.ok){
          if(st){ st.textContent='已保存到被控端：'+(j.path||j.name); st.style.color='#06775A'; }
          if(sp) sp.textContent='';
          setTaskState(id,'done'); finishCard(id);
          if(j.path) addCardBtn(id,'打开文件保存位置',()=>{ if(!authed){ toast('请先连接'); return; } send({t:'open-fs-dir', path:'/sdcard/'+j.path}); toast('已请求打开文件夹'); });
          toast('已保存到被控端：'+(j.path||j.name));
        }
        else { if(st){ st.textContent='保存失败：'+(j.err||''); st.style.color='#C9404F'; } setTaskState(id,'failed'); finishCard(id); }
      }catch(e){ if(st){ st.textContent='回执解析失败：'+e.message; st.style.color='#C9404F'; } setTaskState(id,'failed'); finishCard(id); }
      resolve();
    };
    xhr.onabort = ()=>{
      if(t) t.xhr = null;
      if(t && t.cancelled){ resolve(); return; }   // cancel() 已更新卡片
      if(t && t.wantPause){ setTaskState(id,'paused'); if(st) st.textContent='已暂停，点「继续」从头重发（被控端半截文件已自动清理）'; if(sp) sp.textContent=''; resolve(); return; }
      requeueUpload(item, '发送被中断');
      resolve();
    };
    xhr.onerror = ()=>{
      if(t) t.xhr=null;
      if(t && t.cancelled){ resolve(); return; }
      if(authed && connected && !document.hidden){
        if(st){ st.textContent='发送失败，请重试'; st.style.color='#C9404F'; }
        setTaskState(id,'failed'); finishCard(id);
      } else requeueUpload(item, '连接中断');
      resolve();
    };
    xhr.send(item.blob);
  });
}
/* ≥2MB：切 3 段并行上传（单条连接常跑不满 WiFi），被控端按偏移写临时文件，三段到齐后统一落盘。
   每段各自加密、各自带 4 字节长度帧头；任一段失败即整体失败，不会留下半份文件。 */
async function uploadHttpParts(item){
  const {file, rel, id} = item;
  const t = tasks.get(id), st = $('st'+id), sp = $('sp'+id);
  setTaskState(id,'active');
  const encMode = item.enc !== false;
  const CH = encMode ? 256*1024 : plainChunkSize(file.size);
  const totalChunks = Math.max(1, Math.ceil(file.size/CH));
  const n = Math.min(3, totalChunks);
  const base = Math.floor(totalChunks/n), rem = totalChunks%n;
  const segs = []; let chunk = 0;
  for(let i=0;i<n;i++){ const cnt = base + (i<rem?1:0); segs.push({idx:i, off:chunk*CH, chunks:cnt, blob:null, xhr:null, loaded:0}); chunk += cnt; }
  if(item.parts && item.partsEnc === encMode){
    item.parts.forEach((p,i)=>{ if(segs[i]){ segs[i].off=p.off; segs[i].blob=p.blob; } });
  } else {
    item.parts = null;
    for(let i=0;i<segs.length;i++){
      const seg = segs[i], parts = [];
      if(!encMode){
        // 明文：只拼帧头和文件切片引用，交给浏览器边读边发
        for(let j=0;j<seg.chunks;j++){
          if(t && t.cancelled) return;
          const off = seg.off + j*CH;
          pushPlainFrame(parts, file, off, Math.min(off+CH, file.size));
        }
      } else {
        for(let j=0;j<seg.chunks;j++){
          if(t && t.cancelled) return;
          if(st) st.textContent = '准备加密… '+Math.min(99,Math.round((i*base+j)/totalChunks*100))+'%';
          const off = seg.off + j*CH;
          const buf = new Uint8Array(await file.slice(off, Math.min(off+CH, file.size)).arrayBuffer());
          const body = await encBytes(buf);
          const frame = new Uint8Array(4 + body.length);
          frame[0]=(body.length>>>24)&0xff; frame[1]=(body.length>>>16)&0xff; frame[2]=(body.length>>>8)&0xff; frame[3]=body.length&0xff;
          frame.set(body, 4); parts.push(frame);
          if(j%16===0) await new Promise(r=>setTimeout(r,0));
        }
      }
      seg.blob = new Blob(parts, {type:'application/octet-stream'});
    }
    item.parts = segs.map(s=>({off:s.off, blob:s.blob}));
    item.partsEnc = encMode;
  }
  if(t && t.cancelled) return;
  if(t && t.wantPause){ setTaskState(id,'paused'); if(st) st.textContent='已暂停，点「继续」重新发送'; return; }
  const uid = id + '-' + Date.now().toString(36);
  const q = new URLSearchParams({pin:curPin, name:file.name, dest:$('upDest').value, rel:rel,
    uid, size:String(file.size), parts:String(segs.length)});
  if(!encMode) q.set('enc','0');
  const baseUrl = '/upload?' + q.toString();
  if(st) st.textContent = '正在发送（'+segs.length+' 通道并行）…';
  let finalRes = null, failed = null;
  let lastT = performance.now(), lastLoaded = 0, speed = 0;
  const upd = ()=>{
    const loaded = segs.reduce((a,s)=>a+s.loaded,0), now = performance.now();
    if(now-lastT>=400){ speed=(loaded-lastLoaded)/((now-lastT)/1000); lastT=now; lastLoaded=loaded; }
    setBar(id, loaded, file.size);
    if(st) st.textContent = '正在发送 '+Math.min(100,Math.round(loaded/Math.max(1,file.size)*100))+'% · '+segs.length+' 通道并行';
    if(sp) sp.textContent = fmtSpeed(speed)+' · 剩余 '+fmtEta((file.size-loaded)/Math.max(1,speed));
  };
  const reqs = segs.map(seg=>new Promise(resolve=>{
    const xhr = new XMLHttpRequest(); seg.xhr = xhr;
    xhr.open('POST', baseUrl + '&off=' + seg.off + '&part=' + seg.idx);
    xhr.responseType = 'arraybuffer';
    xhr.upload.onprogress = e=>{ seg.loaded = e.loaded; upd(); };
    xhr.onload = async ()=>{
      try{
        const raw = new Uint8Array(xhr.response);
        const plain = encMode ? await decBytes(raw) : raw;
        const j = JSON.parse(new TextDecoder().decode(plain));
        if(!j.ok) throw new Error(j.err || ('HTTP '+xhr.status));
        if(j.path) finalRes = j;
      }catch(e){ if(!failed) failed = e; }
      resolve();
    };
    xhr.onabort = ()=>{ if(!failed) failed = new Error('发送被中断'); resolve(); };
    xhr.onerror = ()=>{ if(!failed) failed = new Error('连接中断'); resolve(); };
    xhr.send(seg.blob);
  }));
  if(t) t.xhrs = segs.map(s=>s.xhr);
  await Promise.all(reqs);
  if(t) t.xhrs = null;
  if(t && t.cancelled) return;
  if(t && t.wantPause){ setTaskState(id,'paused'); if(st) st.textContent='已暂停，点「继续」重新发送'; if(sp) sp.textContent=''; return; }
  if(failed){
    // 页面被浏览器挂起或链路已断：不判失败，回到队列等重连后自动续传
    if(!authed || !connected || document.hidden){ requeueUpload(item, failed.message); return; }
    if(st){ st.textContent='发送失败：'+failed.message; st.style.color='#C9404F'; }
    setTaskState(id,'failed'); finishCard(id);
    return;
  }
  if(!finalRes){ if(st){ st.textContent='发送完成，但未收到保存结果'; st.style.color='#C9404F'; } setTaskState(id,'failed'); finishCard(id); return; }
  setBar(id,1,1);
  if(st){ st.textContent='已保存到被控端：'+(finalRes.path||finalRes.name); st.style.color='#06775A'; }
  if(sp) sp.textContent='';
  setTaskState(id,'done'); finishCard(id);
  if(finalRes.path) addCardBtn(id,'打开文件保存位置',()=>{ if(!authed){ toast('请先连接'); return; } send({t:'open-fs-dir', path:'/sdcard/'+finalRes.path}); toast('已请求打开文件夹'); });
  toast('已保存到被控端：'+(finalRes.path||finalRes.name));
}
/* 专用 HTTP 下载：单独连接边收边解密，带进度/速度/剩余时间。
   暂停=中断连接但保留已收数据；继续=带 skip=已收完整块数 重新请求，从断点接着收（不重下）。 */
async function httpDownload(path, name, knownSize){
  const id = 'd' + (++taskSeq);
  addCard(id, '↓ ' + name);
  const st = $('st'+id), sp = $('sp'+id);
  const t = {kind:'down', state:'active', path}; tasks.set(id, t);
  const encMode = xferEncOn;   // 下载开始时定下模式，中途切开关不影响本任务
  const CH = 256*1024, t0 = performance.now();
  let lastT = t0, lastGot = 0, speed = 0;
  // ≥2MB 且大小已知：切 3 段并行下载（单条连接常跑不满 WiFi，多连接提速）；小文件/未知大小走单流
  const segs = [];
  if(knownSize >= 2*1024*1024){
    const total = Math.ceil(knownSize/CH), base = Math.floor(total/3), rem = total%3;
    let off = 0;
    for(let i=0;i<3;i++){ const n = base + (i<rem?1:0); segs.push({start:off, chunks:n, parts:[], full:0, got:0, done:false, ctl:null}); off += n; }
  } else {
    segs.push({start:0, chunks:Infinity, parts:[], full:0, got:0, done:false, ctl:null});
  }
  const chanTag = segs.length>1 ? ' · '+segs.length+'通道并行' : '';
  const totalGot = ()=>segs.reduce((a,s)=>a+s.got,0);
  const upd = ()=>{
    const got = totalGot(), now = performance.now();
    if(now-lastT>=400){ speed=(got-lastGot)/((now-lastT)/1000); lastT=now; lastGot=got; }
    if(sp) sp.textContent = fmtSpeed(speed) + (knownSize>0 ? ' · 剩余 '+fmtEta((knownSize-got)/Math.max(1,speed)) : '');
    if(st) st.textContent = knownSize>0 ? ('正在下载 '+Math.min(100,Math.round(got/knownSize*100))+'%'+chanTag) : ('已下载 '+fmtSize(got)+chanTag);
    if(knownSize>0) setBar(id, got, knownSize);
  };
  t.pause = ()=>{ if(t.state!=='active') return; t.pausedFlag = true; segs.forEach(s=>{ if(s.ctl) s.ctl.abort(); }); };
  t.resume = ()=>{ if(t.state!=='paused') return; t.pausedFlag = false; setTaskState(id,'active'); if(st) st.textContent='正在继续下载…'; segs.filter(s=>!s.done).forEach(runSeg); };
  t.cancel = ()=>{ t.cancelled = true; segs.forEach(s=>{ if(s.ctl) s.ctl.abort(); }); setTaskState(id,'cancelled'); if(st) st.textContent='已取消'; if(sp) sp.textContent=''; finishCard(id); };
  wireTaskCtrls(id, t);
  openTaskPanel(); toast('开始下载：'+name);
  if(st) st.textContent='正在连接…';
  function fail(e){
    if(t.failed || t.cancelled) return;
    t.failed = true;
    segs.forEach(s=>{ if(s.ctl) s.ctl.abort(); });
    if(st){ st.textContent='下载失败：'+e.message; st.style.color='#C9404F'; }
    setTaskState(id,'failed'); finishCard(id);
  }
  function finish(){
    setBar(id,1,1);
    saveBlob(new Blob(segs.flatMap(s=>s.parts)), name);
    if(st){ st.textContent='已下载至主控端下载目录：'+name; st.style.color='#06775A'; }
    if(sp) sp.textContent=fmtSize(totalGot())+' · 用时 '+((performance.now()-t0)/1000).toFixed(1)+'s';
    setTaskState(id,'done'); finishCard(id);
    addCardBtn(id,'保存位置说明',()=>toast('已存到本浏览器的下载目录（按 Ctrl+J 查看）'));
    toast('文件已下载：'+name);
  }
  async function runSeg(seg){
    seg.ctl = new AbortController();
    const skip = seg.start + seg.full, left = seg.chunks - seg.full;
    let url = '/file?pin='+encodeURIComponent(curPin)+'&path='+encodeURIComponent(path);
    if(skip>0) url += '&skip='+skip;
    if(isFinite(left)) url += '&count='+left;
    if(!encMode) url += '&enc=0';
    try{
      const resp = await fetch(url, {cache:'no-store', signal:seg.ctl.signal});
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const hn = resp.headers.get('X-File-Name'); if(hn){ try{ name = decodeURIComponent(hn); }catch(_){} }
      const hs = parseInt(resp.headers.get('X-File-Size')||'0',10); if(hs>0) knownSize = hs;
      const reader = resp.body.getReader();
      let buf = new Uint8Array(0);
      while(true){
        const r = await reader.read(); if(r.done) break;
        const nb = new Uint8Array(buf.length + r.value.length); nb.set(buf); nb.set(r.value, buf.length); buf = nb;
        while(buf.length>=4){
          const len = ((buf[0]<<24)|(buf[1]<<16)|(buf[2]<<8)|buf[3])>>>0;
          if(buf.length < 4+len) break;
          const plain = encMode ? await decBytes(buf.subarray(4, 4+len)) : buf.slice(4, 4+len);
          buf = buf.subarray(4+len);
          seg.parts.push(plain); seg.got += plain.length;
          if(plain.length === CH) seg.full++;   // 完整块计数=续传跳块数（末块不满不计）
        }
        upd();
      }
      seg.done = true;
      if(segs.every(s=>s.done)) finish();
    }catch(e){
      if(t.cancelled || t.failed) return;
      if(t.pausedFlag){
        if(t.state!=='paused'){ setTaskState(id,'paused'); if(st) st.textContent='已暂停（已下载 '+fmtSize(totalGot())+'），点「继续」接着下载'; if(sp) sp.textContent=''; }
        return;
      }
      fail(e);
    }
  }
  await Promise.all(segs.map(runSeg));
}
const MAX_UPLOAD_RETRY = 6;
/** 连接中断导致的上传不判失败：退回队列，重连后自动从头发送（已加密的分片缓存可复用，不必重新加密） */
function requeueUpload(item, why){
  const t = tasks.get(item.id);
  if(!t || t.cancelled) return false;
  const st = $('st'+item.id), sp = $('sp'+item.id);
  if(t.wantPause){
    setTaskState(item.id,'paused');
    if(st) st.textContent = '已暂停，点「继续」重新发送';
    if(sp) sp.textContent = '';
    return true;
  }
  t.retries = (t.retries || 0) + 1;
  if(userEnded || endNotified || t.retries > MAX_UPLOAD_RETRY){
    if(st){
      st.textContent = (userEnded || endNotified) ? '会话已结束，上传已取消' : '发送失败：'+(why || '连接中断');
      st.style.color = '#C9404F';
    }
    setTaskState(item.id,'failed'); finishCard(item.id);
    return true;
  }
  if(!upQueue.includes(item)) upQueue.unshift(item);
  setTaskState(item.id,'queued');
  if(st){ st.textContent = '连接中断，已重新排队，连上后自动继续'; st.style.color = ''; }
  if(sp) sp.textContent = '';
  setBar(item.id, 0, 1);
  return true;
}
/** 断线时：没发完的任务重新排队；已发完只等回执的保留，重连后补发 file-up-end 让被控端重放结果 */
function abandonInterruptedUploads(){
  for(const [id, j] of [...upJobs]){
    if(j.sentAll) continue;
    upJobs.delete(id);
    if(j.item){ requeueUpload(j.item, '连接中断'); continue; }
    const cid = protoCard.get(id) ?? id;
    const s = $('st'+cid);
    if(s){ s.textContent = '连接中断，上传已取消，请重连后重新发送'; s.style.color = '#C9404F'; }
    setTaskState(cid,'failed'); finishCard(cid);
  }
}
/** 重连成功（hello → ready）后：补发未确认的结束帧，继续排队中的文件 */
function resumeUploads(){
  for(const id of [...pendingEnds]) send({t:'file-up-end', id});
  pumpUploads();
}
async function uploadOne(item){
  const file = item.file, cid = item.id;
  const t = tasks.get(cid);
  const gen = wsGen;
  const id = ((Date.now() & 0xffff) << 6) | (upSeq++ & 0x3f);
  protoCard.set(id, cid);
  upJobs.set(id, {file, total:file.size, sent:0, sentAll:false, item});
  setTaskState(cid,'active');
  const st = $('st'+cid);
  if(st) st.textContent = '准备发送…';
  send({t:'file-up-meta', id, name:file.name, size:file.size, dest:$('upDest').value});
  const CH = 256*1024;
  for(let off=0; off<file.size; off+=CH){
    if(t && t.cancelled){ upJobs.delete(id); send({t:'file-up-end', id}); return; }
    while(gen===wsGen && ws && ws.readyState===1 && ws.bufferedAmount > 4*1024*1024)
      await new Promise(r=>setTimeout(r,40));
    if(gen!==wsGen || !authed || !ws || ws.readyState!==1){
      upJobs.delete(id);
      requeueUpload(item, '连接中断');
      return;
    }
    let buf;
    try{ buf = new Uint8Array(await file.slice(off, off+CH).arrayBuffer()); }
    catch(e){
      if(st) st.textContent = '读取文件失败：' + e.message;
      upJobs.delete(id); send({t:'file-up-end', id}); setTaskState(cid,'failed'); finishCard(cid); return;
    }
    const frame = new Uint8Array(buf.length+1); frame[0]=0x02; frame.set(buf,1);
    await sendBinary(frame);
    const j = upJobs.get(id); if(!j) return;
    j.sent = off + buf.length;
    setBar(cid, j.sent, file.size);
    if(st) st.textContent = '正在发送 ' + Math.min(100, Math.round(j.sent/file.size*100)) + '%';
  }
  const j = upJobs.get(id);
  if(!j) return;
  j.sentAll = true;
  if(st) st.textContent = '已发送，等待被控端保存…';
  pendingEnds.add(id);
  send({t:'file-up-end', id});
  // 兜底：20 秒没回执也不删任务、不报失败——文件可能已经保存，只是回执丢了；
  // 重连后会自动补发 file-up-end，被控端收到重复结束帧会重放上次的保存结果
  setTimeout(()=>{
    if(!upJobs.has(id)) return;
    const s=$('st'+cid);
    if(s && s.style.color !== 'rgb(127, 220, 160)')
      s.textContent='已发送，等待被控端回执；若被控端「下载/随手控」中已有该文件即保存成功';
  }, 20000);
}

/* ===== 被控端剪贴板记录：最近 20 条，点选即复制到主控端 ===== */
const CLIP_HIST_MAX = 20;
let clipHist = [];
try {
  const v = JSON.parse(localStorage.getItem('pcClipHist')||'[]');
  if(Array.isArray(v)) clipHist = v.filter(x => x && typeof x.s==='string' && x.s).slice(0, CLIP_HIST_MAX);
} catch(_) {}
function saveClipHist(){ try { localStorage.setItem('pcClipHist', JSON.stringify(clipHist)); } catch(_) {} }
function fmtClipTime(t){
  const d = new Date(t), p = n => String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function oneLine(s){ return s.replace(/\s+/g,' ').trim().slice(0, 80); }
function renderClipHist(){
  const box = $('clipHist');
  box.textContent = '';
  if(!clipHist.length){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = '暂无记录：手机复制后将自动显示在此处';
    box.appendChild(e);
  } else {
    for(const it of clipHist){
      const row = document.createElement('div'); row.className='hi';
      const tm = document.createElement('small'); tm.textContent = fmtClipTime(it.t);
      const tx = document.createElement('span'); tx.textContent = oneLine(it.s);
      row.appendChild(tm); row.appendChild(tx);
      row.onclick = ()=> useClipItem(it.s);
      box.appendChild(row);
    }
  }
  const more = document.createElement('div'); more.className='more';
  more.textContent = '重新读取手机当前剪贴板';
  more.onclick = ()=>{ if(authed) send({t:'clip-get'}); else toast('请先连接'); };
  box.appendChild(more);
}
function pushClipHist(s){
  if(!s) return;
  clipHist = clipHist.filter(x => x.s !== s);
  clipHist.unshift({s, t: Date.now()});
  if(clipHist.length > CLIP_HIST_MAX) clipHist.length = CLIP_HIST_MAX;
  saveClipHist();
  if($('clipHist').classList.contains('open')) renderClipHist();
}
function useClipItem(s){
  $('clipIn').value = s;
  copyText(s).then(ok=>{
    if(ok){ rememberPcClip(s); toast('已复制到主控端剪贴板'); }
    else { const ci=$('clipIn'); ci.focus(); ci.select(); }
  });
}
$('btnClipGet').onclick = ()=>{

/* 触屏主控（手机/平板）：显示底部「输入」按钮，触摸画面时自动调出本机输入法 */
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);

/* 独立窗口：顶/底栏默认完全隐藏，鼠标贴到窗口最上/最下边缘(8px)才浮现，闲置 2s 收起。
   触发区不能宽：被控端导航栏/手势区就在画面底部，宽触发区会在点导航时误弹按键条挡住它 */
let popUiTimer = null;
function popShowUi(){
  if(!isPop) return;
  document.body.classList.add('ui');
  clearTimeout(popUiTimer);
  popUiTimer = setTimeout(()=>document.body.classList.remove('ui'), 2000);
}
function popEdgeUi(e){
  if(!isPop) return;
  const y = e.clientY;
  if(y < 8 || y > window.innerHeight - 8) popShowUi();
}
/* 独立窗口横竖屏跟随：手机旋转时把窗口宽高对调（补偿浏览器地址栏高度），整体大小不变，像把手机转 90°。
   拖边拖角仍完全自由——只在方向真正翻转那一下对调，切画质/用户拖拽都不动窗口。
   注：浏览器弹窗必带地址栏（安全限制，网页去不掉）。 */
let popLastLand = null;
function popOrient(){
  if(!isPop) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return;
  const land = vw > vh;
  if(popLastLand === null){ popLastLand = land; return; }   // 首帧只记方向，不动刚开好的窗口
  if(land === popLastLand) return;   // 方向没变（切画质/分辨率）不动用户拖好的窗口
  popLastLand = land;
  try{
    const chromeW = Math.max(0, window.outerWidth - window.innerWidth);
    const chromeH = Math.max(0, window.outerHeight - window.innerHeight);   // 地址栏/标题栏高度
    let nw = window.innerHeight + chromeW, nh = window.innerWidth + chromeH;   // 内容区宽高对调再补回边框
    const aw = screen.availWidth || 1280, ah = screen.availHeight || 900;
    const k = Math.min(1, aw / nw, ah / nh);   // 夹取到屏幕可用范围
    window.resizeTo(Math.round(nw * k), Math.round(nh * k));
  }catch(_){}
}
if(isPop){
  window.addEventListener('pointermove', popEdgeUi, {passive:true});
  window.addEventListener('pointerdown', popEdgeUi, {passive:true});
  video.addEventListener('resize', popOrient);
}

/* ================= 独立窗口（桌面端） ================= */
// 浏览器标签页没法变成无边框窗口：这里开一个按手机比例的弹出窗口，用户可以像小米妙享那样
// 拖动边角自由缩放，画面跟着窗口一起缩放；原来的标签页会主动断开，避免两个主控抢同一条流。
function openStandaloneWindow(){
  if(!authed){ toast('请先连接再打开独立窗口'); return; }
  if(location.protocol === 'file:'){ toast('请通过 http 地址打开主控页后再使用独立窗口'); return; }
  const vw = video.videoWidth || 9, vh = video.videoHeight || 20;
  const aspect = vw / vh;
  const bars = 0;   // 独立窗口内顶/底栏是悬浮自动隐藏层，画面铺满窗口，不再为工具栏预留高度
  const availW = screen.availWidth || 1280, availH = screen.availHeight || 900;
  const contentH = Math.max(420, Math.min(availH - bars - 140, 1180));
  const contentW = Math.round(contentH * aspect);
  const winW = Math.max(320, contentW + 22);
  const winH = contentH + bars + 130;
  const left = Math.max(0, Math.round((availW - winW) / 2));
  const top = Math.max(0, Math.round((availH - winH) / 2));
  // PIN 不进 URL（避免地址栏/历史记录明文暴露）：新窗口与本页同源，连接成功时 PIN 已存
  // localStorage，新窗口启动自动读取并连接；中继模式 URL 只带房间号（房间号不是凭据）
  const url = location.origin + location.pathname + (isRelay ? '#room=' + encodeURIComponent(roomId) : '');
  const w = window.open('', 'pcwin',
    'popup=yes,resizable=yes,width=' + winW + ',height=' + winH + ',left=' + left + ',top=' + top);
  if(!w){ toast('浏览器拦截了独立窗口，请允许本站弹出窗口后重试'); return; }
  try{ w.location.replace(url); }catch(_){ w.location.href = url; }
  try{ w.focus(); }catch(_){}
  // 等浏览器把标题栏/地址栏算出来后再校正一次，让内容区正好是手机比例
  setTimeout(()=>{
    try{
      if(w.closed) return;
      const chromeW = w.outerWidth - w.innerWidth, chromeH = w.outerHeight - w.innerHeight;
      if(chromeW >= 0 && chromeH > 0) w.resizeTo(contentW + chromeW, contentH + bars + chromeH);
    }catch(_){}
  }, 1500);
  userEnded = true;   // 阻止本页 onclose 自动重连
  closeStream();
  clearInterval(pingTimer); clearInterval(statTimer);
  try{ ws && ws.close(); }catch(_){}
  ws = null; authed = connected = false;
  overlay('已在新窗口打开', '请使用新开的窗口操作，本页可以关闭。<br>新窗口按手机比例打开，拖动窗口边角即可缩放。', false);
}

/* 手机主控全屏跟随：浏览器不允许网页凭空全屏/旋转屏幕，点「全屏」进入全屏后才按被控画面方向锁定；
   全屏内被控横竖屏变化时自动重锁，退出全屏解锁——让被控的全屏画面在主控上也铺满成全屏模样 */
function fsLockOrient(){
  const vw = video.videoWidth, vh = video.videoHeight;
  const want = (vw && vh && vw > vh) ? 'landscape' : 'portrait';
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock(want).catch(()=>{}); }catch(_){}
}
if(isTouch){

    try{

      else await document.exitFullscreen();
    }catch(_){ toast('浏览器拒绝全屏，请点一下画面后重试'); }
    fsLockOrient();
  };
  document.addEventListener('fullscreenchange', ()=>{
    if(document.fullscreenElement) fsLockOrient();
    else { try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(_){} }
  });
  video.addEventListener('resize', ()=>{ if(document.fullscreenElement) fsLockOrient(); });
}
$('connBtn').onclick = ()=> connect(false);
$('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') connect(); });
function reconnectNow(){
  if(!hadSession || authed || userEnded || endNotified) return;
  if(ws && (ws.readyState === 0 || ws.readyState === 1)) return;   // 正在握手/已连上，交给原有逻辑
  clearTimeout(reconnectTimer); reconnectTimer = null;
  reconnectWhenVisible = false;
  reconnectTry = 0;
  connect(true);
}
/* 网络恢复、窗口重新聚焦：不必等下一次定时重试，立刻续上 */
window.addEventListener('online', reconnectNow);
window.addEventListener('focus', reconnectNow);
/* 主控切回前台：手机浏览器把页面挂到后台会掐断 WS，回来时立即续上，不用刷新 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  lastRxAt = performance.now();
  if(userEnded || endNotified) return;
  // 切回前台立即恢复：后台期间浏览器挂起解码，6 秒卡死检测会误判并整条重建（很慢）。
  // 复位检测基准 + 直接追到缓冲最新帧 + 要一个关键帧，画面秒恢复，不等看门狗/自动恢复
  lastDecodedAt = performance.now(); lastFrameAt = 0; lastJump = 0;
  try{
    if(video.buffered && video.buffered.length){
      video.currentTime = video.buffered.end(video.buffered.length-1) - 0.02;
      video.playbackRate = 1;
    }
  }catch(_){}
  if(authed && connected) send({t:'kf'});
  kickVideoPlay();
  if(ws && ws.readyState === 1 && authed){ send({t:'ping', ts:performance.now()}); return; }
  if(ws && ws.readyState === 0 && !authed) return;   // 正在握手，交给原有超时/重连
  if(hadSession){
    clearTimeout(reconnectTimer); reconnectTimer = null;
    reconnectWhenVisible = false;
    reconnectTry = 0;
    connect(true);
  }
});
$('btnEnd').onclick = ()=>{ if(authed){ userEnded = true; send({t:'end'}); closeStream(); toast('已请求被控端结束会话'); } else toast('未连接'); };
$('qualitySel').onchange = e => {
  if(!authed) return;
  showSwitching();
  send({t:'quality', preset:e.target.value});   // 被控端切换后广播确认，所有主控保持一致
};

/* PIN 来源优先级：链接 #片段 > 链接 ?参数 > 本机上次连成功的记录。
   二维码同时带 ?pin= 和 #pin=：部分扫码器会把 # 后面的内容丢掉，查询参数仍能带上；
   记住上次的 PIN 后，直接从书签/地址栏打开同一地址也能自动连上（PIN 错误会清掉记录）。 */
(function(){
  const q = new URLSearchParams(location.search);
  const h = new URLSearchParams(location.hash.slice(1));
  const room = h.get('room') || q.get('room') || '';
  if(room){ isRelay = true; roomId = room; }
  updateXferUi();
  let pin = h.get('pin') || q.get('pin') || '';
  if(!pin){ try{ pin = localStorage.getItem('pcPin:'+location.host) || ''; }catch(_){} }
  if(/^\d{6}$/.test(pin)){ $('pinInput').value = pin; setTimeout(()=>connect(false), 300); }
  if(location.protocol==='file:') $('wsAddr').style.display='inline-block';
})();
</script>
</body>
